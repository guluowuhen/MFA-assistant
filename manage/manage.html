<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MFA 配置中心</title>
    <link rel="stylesheet" href="./manage.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>MFA助手配置</h1>

      <section class="panel">
        <div class="upload-tip">请上传 MFA 二维码图片（支持多选）</div>
        <div class="row">
          <input id="qrFilesInput" type="file" accept="image/*" multiple />
        </div>
      </section>

      <section class="panel">
        <div class="table-head">
          <div class="sub-title">待保存列表</div>
          <button id="manualAddBtn" type="button">新增</button>
        </div>

        <div class="table-wrap">
          <table class="pending-table">
            <thead>
              <tr>
                <th><span class="required-star">*</span> 系统名称</th>
                <th><span class="required-star">*</span> mfa_url</th>
                <th>密钥文本</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="pendingTableBody"></tbody>
          </table>
        </div>

        <div class="actions">
          <button id="clearPendingBtn" type="button">清空</button>
          <button id="saveSelectedBtn" type="button" class="primary">保存</button>
        </div>
      </section>

      <section class="panel">
        <div class="table-head">
          <div class="sub-title">已绑定系统</div>
          <div class="io-actions">
            <button id="importBtn" type="button">导入</button>
            <button id="exportBtn" type="button">导出</button>
            <input id="importFileInput" type="file" accept="application/json,.json" hidden />
          </div>
        </div>
        <div id="savedList" class="list"></div>
      </section>

      <section id="importConflictPanel" class="panel" hidden>
        <div class="table-head">
          <div id="importConflictTitle" class="sub-title">导入冲突处理</div>
          <div class="io-actions">
            <button id="keepImportAllBtn" type="button">全部覆盖</button>
            <button id="keepExistingAllBtn" type="button">全部保留</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="pending-table">
            <thead>
              <tr>
                <th>mfa_url</th>
                <th>已绑定</th>
                <th>导入</th>
                <th>处理方式</th>
              </tr>
            </thead>
            <tbody id="importConflictBody"></tbody>
          </table>
        </div>
        <div class="actions">
          <button id="cancelImportReviewBtn" type="button">取消</button>
          <button id="applyImportReviewBtn" type="button" class="primary">应用导入</button>
        </div>
      </section>

      <p id="msg" class="msg"></p>
    </main>

    <script src="./jsQR.js"></script>
    <script src="./manage.js"></script>
  </body>
</html>
